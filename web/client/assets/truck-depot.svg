<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 60 510 440" role="img"><title>Unbranded truck on the depot route</title><style>
.truck{animation:ride .6s ease-in-out 8;transform-box:fill-box;transform-origin:center}.wheel{animation:spin .6s linear 8;transform-box:fill-box;transform-origin:center}.road-lines{animation:road 1.2s linear 4}
@keyframes ride{50%{transform:translateY(-2px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes road{to{transform:translateX(-120px)}}
@media(prefers-reduced-motion:reduce){.truck,.wheel,.road-lines{animation:none}}
