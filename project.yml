name: TalentIQ
options:
  bundleIdPrefix: com.talentiq
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSMicrophoneUsageDescription: 'TalentIQ records interviews when a recruiter starts recording.'
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'TalentIQ transcribes recorded interviews for recruiter notes.'
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'TalentIQ can import candidate resume images.'
    INFOPLIST_KEY_NSCameraUsageDescription: 'TalentIQ scans event codes and paper resumes.'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
    SUPPORTS_MACCATALYST: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  TalentIQ:
    type: application
    platform: iOS
    sources: [TalentIQ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talentiq.app
        INFOPLIST_KEY_CFBundleDisplayName: TalentIQ
  TalentIQTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TalentIQTests]
    dependencies:
      - target: TalentIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talentiq.tests
